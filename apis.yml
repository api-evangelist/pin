name: PIN
description: 'PIN (getpin.xyz) is a fintech platform that makes it easy to launch and operate an
  investment club or syndicate, handling the administrative, legal, and tax work for group startup
  investments so a community can pool capital and invest in VC-backed startups together. Members
  onboard in a few simple steps, commit to deals, vote, and PIN manages the tax filings and portfolio
  support for the lifecycle of the club. PIN is venture-backed by Initialized, NEA, Industry Ventures
  and others. As of this enrichment pass PIN publishes only a marketing site and a member web app
  (app.getpin.xyz); no public API, developer portal, OpenAPI/AsyncAPI specification, SDK, or
  /.well-known discovery surface was found.'
